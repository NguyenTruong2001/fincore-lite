spring:
  application:
    name: fincore-lite

  datasource:
    hikari:
      pool-name: FincoreHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: fincore
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: fincore
    default-schema: fincore
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [thread=%thread] [corr=%X{correlationId:-}] %logger{36} - %msg%n"