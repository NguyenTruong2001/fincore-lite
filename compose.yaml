services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - fincore-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

    restart: unless-stopped

    networks:
      - fincore-local

volumes:
  fincore-postgres-data:
    name: fincore-postgres-data

networks:
  fincore-local:
    name: fincore-local
    driver: bridge